name: Windows インストーラ

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # リリースを作るには書き込み権限が要る。
    # 既定は読み取りだけで、タグを打っても 403 で添付に失敗する
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 7-Zip と Inno Setup を導入
        run: |
          choco install --no-progress -y 7zip innosetup

      - name: インストーラをビルド
        shell: pwsh
        working-directory: packaging/windows
        run: ./build.ps1

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ikensho-ocr-windows-installer
          path: packaging/windows/dist/*.exe

      - name: リリースに添付
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/windows/dist/*.exe
