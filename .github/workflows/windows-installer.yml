name: Windows インストーラ

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 7-Zip と Inno Setup を導入
        run: |
          choco install --no-progress -y 7zip innosetup

      - name: インストーラをビルド
        shell: pwsh
        working-directory: packaging/windows
        run: ./build.ps1

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ikensho-ocr-windows-installer
          path: packaging/windows/dist/*.exe

      - name: リリースに添付
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/windows/dist/*.exe
