[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikensho-ocr"
version = "0.1.0"
description = "主治医意見書（介護保険）の読み取り・確認・出力ツール"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Masaru Sanuki, University of Tsukuba & Department of Biomedical Informatics, University of Tsukuba Hospital" },
]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pypdfium2>=4.20",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
build = ["pdfplumber>=0.11"]

[project.scripts]
ikensho = "ikensho_ocr.cli:main"

[tool.setuptools]
packages = ["ikensho_ocr"]
